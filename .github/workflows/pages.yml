name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"   # refresh generation data; GitHub schedules can be delayed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked python build.py
      - name: Refresh generation for all countries (public, no token)
        run: uv run --locked python scripts/fetch_generation.py
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .hf-cache
          key: search-text-q8-daa72c51243991dfcaf9f9137d2c573d8f7790c0-transformers-4.3.1-${{ runner.os }}
      - name: Build text search index
        env:
          HF_CACHE_DIR: ${{ github.workspace }}/.hf-cache
        run: npm run build:search
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
