name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Test Python
        if: hashFiles('tests/test*.py') != ''
        run: uv run --locked python -m unittest discover -s tests
      - uses: actions/setup-node@v7
        if: hashFiles('tests/*.test.mjs', 'search/tests/*.test.mjs') != ''
        with:
          node-version: "24"
          cache: npm
      - name: Install JavaScript dependencies
        if: hashFiles('tests/*.test.mjs', 'search/tests/*.test.mjs') != ''
        run: npm ci
      - name: Test JavaScript
        if: hashFiles('tests/*.test.mjs', 'search/tests/*.test.mjs') != ''
        shell: bash
        run: |
          shopt -s nullglob
          test_files=(tests/*.test.mjs search/tests/*.test.mjs)
          uv run --locked node --test "${test_files[@]}"
